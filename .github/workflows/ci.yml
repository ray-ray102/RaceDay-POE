name: Part 2 CI

on:
  push:
    branches: [ main, "part-2*", "part-3*", "final*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore RaceDay-POE-API.sln

      - name: Build solution
        run: dotnet build RaceDay-POE-API.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay-POE-API.sln --configuration Release --no-build --verbosity normal