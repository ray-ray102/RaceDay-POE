name: Part 2/3 CI

on:
  push:
    branches: [ main, "part-2*", "part-3*", "final*", "poe*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore RaceDay-POE-API.sln

      - name: Build API, tests and MVC web
        run: dotnet build RaceDay-POE-API.sln --configuration Release --no-restore

      - name: Build MVC web project explicitly
        run: dotnet build RaceDay-POE-Web/RaceDay-POE-Web.csproj --configuration Release --no-restore

      - name: Run API unit tests
        run: dotnet test RaceDay-POE-API.Tests/RaceDay-POE-API.Tests.csproj --configuration Release --no-build --verbosity normal
